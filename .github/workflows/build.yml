name: Build app package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check and package
        run: scripts/build.sh dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: spl-library
          path: dist/*.spl
          if-no-files-found: error
